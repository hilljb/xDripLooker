name: xdrip
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.12

  # MongoDB driver + DNS resolution for mongodb+srv:// URIs
  # Note: pymongo is available on conda-forge and is the preferred install method
  # here because it bundles the correct C-extension wheels per platform.
  # dnspython is required by pymongo for SRV connection string DNS lookups.
  - pymongo=4.16.0
  - dnspython=2.8.0

  # Data analysis
  - pandas=3.0.1

  # Notebook / interactive analysis
  - jupyter=1.1.1
  - jupyterlab=4.5.6

  # Testing
  - pytest=9.0.2
